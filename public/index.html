<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MV8HQZJYQV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-MV8HQZJYQV');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#060606" />
  <title>Creatorrr | Under Construction</title>

  <link rel="icon" type="image/png" href="./creatorrr-logo-nolink.png" />
  <link rel="apple-touch-icon" href="./creatorrr-logo-nolink.png" />

  <style>
    :root {
      --bg: #060606;
      --text: #f5f5f5;
      --muted: rgba(245,245,245,.72);
      --gold-1: #f7d56a;
      --gold-2: #b8892a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(900px 520px at 82% -8%, rgba(247,213,106,.10), transparent 58%),
        radial-gradient(780px 480px at 6% 4%, rgba(184,137,42,.08), transparent 55%),
        linear-gradient(180deg, #050505 0%, #090909 48%, #050505 100%);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      width: min(640px, 100%);
      text-align: center;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 26px;
      object-fit: contain;
      border-radius: 14px;
      filter: drop-shadow(0 14px 28px rgba(0,0,0,.45));
    }

    h1 {
      margin: 0 0 28px;
      font-size: clamp(44px, 9vw, 76px);
      line-height: .95;
      letter-spacing: -2.5px;
      background: linear-gradient(180deg, #fff1a9 0%, var(--gold-1) 42%, var(--gold-2) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .wait-title {
      margin: 0 0 16px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    form {
      display: flex;
      gap: 10px;
      width: min(520px, 100%);
      margin: 0 auto 18px;
    }

    input {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 48px;
      padding: 0 16px;
      color: var(--text);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      background: rgba(0,0,0,.30);
      outline: none;
      font: inherit;
      font-size: 14px;
    }

    input:focus {
      border-color: rgba(247,213,106,.58);
      box-shadow: 0 0 0 3px rgba(247,213,106,.10);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 20px;
      border: 1px solid transparent;
      border-radius: 999px;
      color: #0b0b0b;
      background: linear-gradient(180deg, var(--gold-1), var(--gold-2));
      box-shadow: 0 14px 30px rgba(184,137,42,.20);
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
    }

    button:disabled {
      opacity: .6;
      cursor: default;
    }

    .sub-link {
      display: inline-block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .status {
      display: none;
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.4;
    }

    .status.show { display: block; }
    .status.success { color: #bdf2c6; }
    .status.error { color: #ffb4b4; }

    @media (max-width: 560px) {
      form { flex-direction: column; }
      input, .btn { width: 100%; }
    }
  </style>
</head>

<body>
  <main>
    <img class="logo" src="./creatorrr-logo-nolink.png" alt="Creatorrr" />

    <h1>UNDER CONSTRUCTION</h1>

    <div class="wait-title">LET ME KNOW WHEN CREATORRR.COM IS READY:</div>

    <form id="waitlist-form">
      <input
        id="waitlist-email"
        type="email"
        autocomplete="email"
        placeholder="you@example.com"
        aria-label="Email address"
        required
      />
      <button id="waitlist-submit" class="btn" type="submit">Join waitlist</button>
    </form>

    <a
      class="sub-link"
      href="https://www.reddit.com/r/NSFWCreatorsAdvice/"
      target="_blank"
      rel="noopener noreferrer"
    >
      Check out r/NSFWCreatorsAdvice
    </a>

    <div id="waitlist-status" class="status" role="status" aria-live="polite"></div>
  </main>

  <script>
    const API_BASE = "https://api.creatorrr.com";
    const form = document.getElementById("waitlist-form");
    const email = document.getElementById("waitlist-email");
    const submit = document.getElementById("waitlist-submit");
    const status = document.getElementById("waitlist-status");

    function setStatus(text, type = "") {
      status.textContent = text;
      status.className = "status show" + (type ? " " + type : "");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      submit.disabled = true;
      setStatus("Sending...");

      try {
        const res = await fetch(`${API_BASE}/email/subscribe`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            email: email.value.trim(),
            source: "under_construction_waitlist"
          })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok || data.ok === false) {
          throw new Error(data.error || "Could not subscribe right now.");
        }

        if (data.status === "verified") {
          setStatus("You’re already on the list.", "success");
        } else if (data.verification_sent) {
          setStatus("Check your email to confirm.", "success");
          form.reset();
        } else {
          setStatus("Subscribed.", "success");
          form.reset();
        }
      } catch (err) {
        setStatus(err instanceof Error ? err.message : "Could not subscribe right now.", "error");
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
